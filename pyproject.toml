[project]
name = "taskboard-agent-orchestrator"
version = "0.1.0"
description = "Redmine-backed taskboard agent orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.5.5",
    "httpx>=0.28.0",
    "langchain>=1.3.11",
    "langchain-litellm>=0.7.0",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "litellm>=1.72.0",
    "python-dotenv>=1.0.0",
    "trafilatura>=2.0.0",
]

[project.scripts]
taskboard-agent = "taskboard_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taskboard_agent"
module-root = "src"
